name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:    # 允许手动触发

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            archive_name: WatermarkRemover-1.0.0-macOS.dmg
          - os: ubuntu-latest
            archive_name: WatermarkRemover-1.0.0-linux.tar.gz
          - os: windows-latest
            archive_name: WatermarkRemover-1.0.0-windows.zip

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # 平台特定：准备 ffmpeg/ffprobe 二进制到项目根
      - name: Prepare ffmpeg (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install ffmpeg
          cp "$(which ffmpeg)" ffmpeg
          cp "$(which ffprobe)" ffprobe

      - name: Prepare ffmpeg (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          cp "$(which ffmpeg)" ffmpeg
          cp "$(which ffprobe)" ffprobe

      - name: Prepare ffmpeg (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          choco install -y ffmpeg
          $ffmpeg = (Get-Command ffmpeg).Source
          $ffprobe = (Get-Command ffprobe).Source
          Copy-Item $ffmpeg ffmpeg.exe
          Copy-Item $ffprobe ffprobe.exe

      # PyInstaller：cwd 保持项目根，spec 在 packaging/ 下，相对路径从 spec 解析
      - name: PyInstaller build
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --distpath dist \
            --workpath packaging/build \
            packaging/watermark-remover.spec

      # 平台特定：打包成最终分发格式（cwd = 项目根）
      - name: Package (macOS DMG)
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p dmg-staging
          cp -R dist/WatermarkRemover.app dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "Watermark Remover 1.0.0" \
            -srcfolder dmg-staging \
            -ov -format UDZO \
            ${{ matrix.archive_name }}

      - name: Package (Linux tarball)
        if: matrix.os == 'ubuntu-latest'
        run: |
          tar czf ${{ matrix.archive_name }} -C dist WatermarkRemover/

      - name: Package (Windows zip)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/WatermarkRemover -DestinationPath ${{ matrix.archive_name }}

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive_name }}
          fail_on_unmatched_files: false

      - name: Upload workflow artifacts (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: ${{ matrix.archive_name }}
          if-no-files-found: ignore