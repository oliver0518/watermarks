<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>秋白去水印</title>
  <link rel="stylesheet" href="static/main.css">
</head>
<body>
  <header class="app-bar">
    <div class="brand">
      <span class="brand-dot">秋</span>
      <span>秋白去水印</span>
    </div>
    <nav class="app-nav" id="app-nav">
      <button data-view="home" class="nav-btn active">主页</button>
      <button data-view="history" class="nav-btn">历史<span class="nav-badge" id="history-count">0</span></button>
    </nav>
    <span class="pill" id="hint-pill">本地处理 · 隐私安全</span>
  </header>

  <div class="app">
    <div class="title-row">
      <h1>视频去水印</h1>
      <p class="sub">OpenCV 智能修复 · 逐帧修复 · 全程本地完成</p>
    </div>

    <!-- 历史记录 - 主页面板移除，移到独立 step-history -->
    <section class="card hidden" id="step-history">
      <div class="row-spread">
        <h2 style="margin-bottom:0"><span class="step-num">📁</span> 历史记录</h2>
        <div>
          <button id="btn-history-save-all" type="button" disabled><span class="ico">⤓</span> 全部下载</button>
        </div>
      </div>
      <p class="hint" id="history-page-hint">所有处理过的视频都在这里</p>
      <ul class="history-list" id="history-list"></ul>
      <p class="history-empty" id="history-empty">暂无历史记录，处理一次后会显示在这里</p>
    </section>

    <!-- Step 1: 选择视频 -->
    <section class="card" id="step-upload">
      <h2><span class="step-num">1</span> 选择视频</h2>
      <div id="dropzone" class="dropzone">
        <div class="dz-icon">🎬</div>
        <p class="dz-text">拖拽视频到这里，或 <span class="link">点击选择</span></p>
        <p class="dz-hint">支持 MP4 / MOV / AVI / MKV / WEBM · 可多选批量处理</p>
      </div>
      <input type="file" id="file-input" accept="video/*" hidden multiple>
      <div id="upload-status" class="status hidden"></div>

      <!-- 队列 -->
      <div id="queue-wrap" class="queue-wrap hidden">
        <div class="queue-toolbar">
          <span class="queue-title" id="queue-title">0 个文件</span>
          <span class="queue-progress" id="queue-progress"></span>
          <div class="queue-actions">
            <button id="btn-batch-process" type="button" class="primary" disabled><span class="ico">▶</span> 开始生成</button>
            <button id="btn-save-all" type="button" disabled><span class="ico">⤓</span> 全部下载</button>
            <button id="btn-queue-clear" type="button" class="danger"><span class="ico">🗑</span> 清空</button>
          </div>
        </div>
        <div class="queue-settings">
          <label>算法
            <select id="method">
              <option value="telea" selected>Telea 快速</option>
              <option value="ns">Navier-Stokes 平滑</option>
            </select>
          </label>
          <label>修复半径
            <input type="range" id="radius" min="1" max="8" value="3">
            <span class="range-val" id="radius-val">3</span>
          </label>
        </div>
        <ul class="queue-list" id="queue-list"></ul>
      </div>
    </section>

    <!-- Step 2: 框选水印 -->
    <section class="card hidden" id="step-select">
      <h2><span class="step-num">2</span> 框选要去除的水印</h2>
      <div class="select-wrap">
        <div class="video-box" id="video-box">
          <video id="video" playsinline muted></video>
          <div id="selection" class="selection hidden"></div>
          <div class="video-overlay" id="video-overlay"></div>
        </div>
        <div class="controls">
          <button id="btn-play" type="button" class="icon"><span class="ico">▶</span> 播放</button>
          <button id="btn-clear" type="button" class="secondary icon"><span class="ico">✕</span> 清除</button>
          <span class="sel-info" id="sel-info">拖动鼠标在画面上框选水印位置</span>
        </div>
      </div>
    </section>

    <!-- Step 3: 之前独立 step-process 已合并到队列：选框完成后直接返回列表，
         用户统一点"开始生成"按钮逐个处理已框选项。 -->

    <!-- Step 4: 结果 -->
    <section class="card hidden" id="step-result">
      <h2><span class="step-num">✓</span> 处理完成</h2>
      <div class="result-box">
        <video id="result-video" controls playsinline></video>
        <p class="result-meta" id="result-meta"></p>
        <div class="result-actions">
          <button id="btn-save-as" type="button" class="primary"><span class="ico">⤓</span> 保存到…</button>
          <button id="btn-restart" type="button" class="secondary">处理下一个</button>
        </div>
      </div>
    </section>
  </div>

  <div class="toast-host" id="toast-host"></div>

  <!-- 预览模态框 -->
  <div id="preview-modal" class="modal hidden" aria-hidden="true">
    <div class="modal-mask" data-close></div>
    <div class="modal-body">
      <button class="modal-close" data-close aria-label="关闭">×</button>
      <video id="preview-video" controls autoplay playsinline></video>
      <p class="modal-caption" id="preview-caption"></p>
    </div>
  </div>

  <script src="static/app.js"></script>
</body>
</html>
